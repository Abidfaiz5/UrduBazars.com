<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&amp;family=Poppins:wght@700;800&amp;display=swap');
      .brand-title-urdu { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 56px; fill: #082B4C; }
      .brand-title-bazars { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 56px; fill: #F47700; }
      .brand-tagline { font-family: 'Noto Nastaliq Urdu', serif; font-size: 26px; fill: #082B4C; text-anchor: middle; }
    </style>
  </defs>

  <!-- Pixelated / Digital squares floating from top left -->
  <rect x="110" y="45" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="130" y="45" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="130" y="65" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="150" y="65" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="150" y="85" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="170" y="85" width="14" height="14" fill="#082B4C" rx="1.5" />
  <rect x="170" y="105" width="14" height="14" fill="#082B4C" rx="1.5" />

  <!-- Letter U (Navy Blue #082B4C) -->
  <path d="M 175 125 
           L 205 125 
           L 205 210 
           C 205 235 220 250 245 250 
           C 270 250 285 235 285 210 
           L 285 75 
           L 315 75 
           L 315 210 
           C 315 255 285 282 245 282 
           C 205 282 175 255 175 210 
           Z" 
        fill="#082B4C" />

  <!-- Letter B (Warm Orange #F47700) -->
  <path d="M 285 75 
           L 360 75 
           C 395 75 415 95 415 128 
           C 415 152 400 168 380 174 
           C 405 180 422 200 422 230 
           C 422 265 395 282 355 282 
           L 285 282 
           L 285 250 
           L 355 250 
           C 375 250 390 240 390 226 
           C 390 212 375 202 350 202 
           L 315 202 
           L 315 170 
           L 350 170 
           C 370 170 385 160 385 146 
           C 385 132 370 107 350 107 
           L 285 107 
           Z" 
        fill="#F47700" />

  <!-- Brand Text: Urdu Bazars -->
  <g transform="translate(45, 345)">
    <text x="0" y="0" class="brand-title-urdu">Urdu</text>
    <text x="145" y="0" class="brand-title-bazars">Bazars</text>
  </g>

  <!-- Tagline Dividers & Urdu Text: کتاب سے دنیا تک -->
  <!-- Left navy line with circle -->
  <line x1="45" y1="395" x2="160" y2="395" stroke="#082B4C" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="160" cy="395" r="4.5" fill="#082B4C" />

  <!-- Center Urdu Calligraphy -->
  <text x="250" y="405" class="brand-tagline">کتاب سے دنیا تک</text>

  <!-- Right orange line with circle -->
  <circle cx="340" cy="395" r="4.5" fill="#F47700" />
  <line x1="340" y1="395" x2="455" y2="395" stroke="#F47700" stroke-width="2.5" stroke-linecap="round" />
</svg>
